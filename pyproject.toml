[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runtime"
version = "0.1.0"
description = "Agentic runtime: FastAPI platform + Celery dispatch + LangGraph mission graphs + Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # celery 5.5.3+ pulls kombu[redis] in its redis extra, which caps redis
    # at <=5.2.1; celery 5.6+ needs kombu>=5.6. Keep <5.5.3 so redis 5.3.x
    # and the kombu<5.6 cap below both hold.
    "celery[redis]>=5.4,<5.5.3",
    # croniter: used directly by the schedule service (cron validation
    # and next-run computation). It also comes in transitively via celery,
    # but it is a direct dependency of ours — declare it explicitly.
    # 7.x is untested here, so stay on 6.x (installed: 6.2.4).
    "croniter>=6.0,<7",
    # kombu 5.6+ requires redis-py>=6.4, but falkordb below (and our redis pin) cap it at <6.
    "kombu>=5.3.4,<5.6",
    "redis>=5.0,<6",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "langgraph>=0.2,<2",
    "langchain>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "deepagents>=0.2,<1",
    # opensandbox: Python SDK for the self-hosted OpenSandbox server
    # (per-session sandbox backend for the Deep Agent — docs/sandbox.md).
    # 1.2.x is the release the adapter was verified against.
    "opensandbox>=1.2,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "langsmith>=0.2,<1",
    "qdrant-client>=1.11,<2",
    "neo4j>=5.26,<6",
    "minio>=7.2,<8",
    # boto3: the MLflow *client* needs it to upload artifacts (e.g. eval
    # report.md) to the server's S3 (MinIO) artifact root. Without it,
    # `make eval` fails with "No module named 'boto3'" even when the
    # server is up (see scripts/eval_mission.py).
    "boto3>=1.26,<2",
    "mlflow>=2.18,<4",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    # alembic: schema migrations (alembic/versions). init_db()/create_all
    # cannot alter an existing table — every schema change after the
    # baseline goes through a migration (see README section 20).
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
# Dev/test tooling (pytest, ruff). httpx is already a main dep (TestClient).
# langgraph-cli powers `langgraph dev --allow-blocking` (see langgraph.json);
# the [inmem] extra provides the langgraph-api server it needs.
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "langgraph-cli[inmem]>=0.4,<1",
]
# Alternative LLM provider (primary is langchain-openai, see runtime/deep_agent.py).
anthropic = ["langchain-anthropic>=0.3,<2"]
# Optional Postgres checkpointer for LangGraph (runtime/mission_graph.py).
# Without it, graphs run without persistent checkpoints (default).
postgres-checkpoint = ["langgraph-checkpoint-postgres>=2.0,<4"]

[tool.setuptools.packages.find]
include = ["app*", "runtime*", "infra*", "ingest*", "ontology*", "seeds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate`: long
# op.create_index lines are the generator's formatting, not ours.
"alembic/versions/0001_baseline.py" = ["E501"]

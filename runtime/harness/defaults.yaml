# Shared mission harness defaults — override per mission in seeds/missions/*.yaml.
security:
  user_runnable: false
guest_channel:
  exposes_public_chat: false
builtin_tools:
  deny: false
  deny_message_template: null
flow_subgraph:
  enabled: false
guest_output:
  register_reply_tools: false
  capability: null
notifications:
  notify_admin_actions: false
context_budget:
  reclaim_retrieval_for_history: false
output_files:
  required: false
output_artifacts:
  sink: none
  strip_inline: true
  inline_fallback: true
tool_calls:
  sequential: []
tool_budget:
  tools: []
  max_result_tokens: 0
  max_calls: {}
sandbox:
  command_timeout_seconds: 90
  command_timeout_max_seconds: 600
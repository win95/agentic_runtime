# Example mission from the architecture design: equipment fault analysis.
# A Mission is CONFIG, not a LangGraph.
mission_id: fault_analysis
version: 1
name: Fault Analysis
objective: >
  Analyze equipment faults and identify root causes.

input_schema:
  type: object
  properties:
    asset_id:
      type: string
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
  required:
    - asset_id
    - start_date
    - end_date

execution:
  mode: hybrid
  agent_id: fault_investigator
  skills:
    - fault-investigation
    - report-writing
  # Pre-retrieval into the agent's context window (SessionStart hook
  # `retrieval_context`): the agent's first model call already sees
  # the asset's faults, docs and relations instead of re-discovering
  # them through tools. Sources are opt-in per mission; max_chars caps
  # the injected block (whole lines are dropped to fit). max_chars is
  # not set here: the hook default applies (12,288 chars from the
  # context budget — 3,072 retrieval tokens).
  retrieval:
    sources: [faults, documents, relations]

capabilities:
  - fault_history
  - maintenance_analysis
  - knowledge_retrieval
  # F1 fix (2026-11-11): sensor_data and asset_relations share the
  # fault_analysis subgraph (deduped in capability_node) but must be
  # declared here or registry.check() blocks get_sensor_data and
  # query_asset_relationships from reaching the agent.
  - sensor_data
  - asset_relations

output_schema:
  type: object
  properties:
    root_causes:
      type: array
    evidence:
      type: array
    recommendations:
      type: array

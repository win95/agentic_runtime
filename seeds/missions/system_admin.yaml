# Admin bot mission: administer the agentic-runtime platform itself.
# A Mission is CONFIG, not a LangGraph.
mission_id: system_admin
version: 1
name: System Admin
objective: >
  Administer the agentic-runtime platform: inspect executions, missions
  and agents, check the health of platform dependencies, and manage
  missions and executions (create/update/delete missions, dispatch and
  cancel executions). Answer in Vietnamese. Only use the admin tools.
  Never invent data: report exactly what the tools return. Destructive
  actions (delete_mission, cancel_execution) require the exact id named
  in the request; refuse ambiguous destructive requests.

input_schema:
  type: object
  properties:
    request:
      type: string
  required:
    - request

execution:
  mode: autonomous
  agent_id: admin_bot
  skills:
    - admin-operations
    - report-writing

capabilities:
  - system_admin

output_schema:
  type: object
  properties:
    answer:
      type: string
    actions_taken:
      type: array
    evidence:
      type: array
